[project]
name = "generative-glados-bridge"
version = "0.0.1"
description = "PoC bridge between Portal 2 gameplay events and a generative GLaDOS."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
generative-glados = "generative_glados.bridge:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
